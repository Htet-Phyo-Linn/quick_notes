    (function() {
      if (window.postAvWebViewMessage) {
        if (!window.postAvWebViewMessage.postMessage && typeof window.postAvWebViewMessage.PostMessage === 'function') {
          window.postAvWebViewMessage.postMessage = function(msg) { window.postAvWebViewMessage.PostMessage(msg); };
        }
      }
      if (!window.chrome) { window.chrome = {}; }
      if (!window.chrome.webview) {
        window.chrome.webview = {
          postMessage: function(msg) {
            var str = (typeof msg === 'string') ? msg : JSON.stringify(msg);
            if (window.postAvWebViewMessage) {
              if (typeof window.postAvWebViewMessage.postMessage === 'function') {
                window.postAvWebViewMessage.postMessage(str);
                return;
              }
              if (typeof window.postAvWebViewMessage.PostMessage === 'function') {
                window.postAvWebViewMessage.PostMessage(str);
                return;
              }
            }
            if (typeof window.invokeCSharpAction === 'function') {
              window.invokeCSharpAction(str);
            } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.webview) {
              window.webkit.messageHandlers.webview.postMessage(str);
            }
          }
        };
      }
      window.executeEditorAction = function(action) {
        if (typeof window.executeAction === 'function') {
          window.executeAction(action);
        }
      };
      window.setTheme = function(theme) {
        var isLight = (theme === 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        if (isLight) {
          document.body.classList.remove('theme-dark');
          document.body.classList.add('theme-light');
          document.body.style.backgroundColor = '#f0f4f9';
          document.body.style.color = '#0f172a';
          var container = document.getElementById('editor-container');
          if (container) {
            container.style.backgroundColor = '#f0f4f9';
            container.style.color = '#0f172a';
          }
        } else {
          document.body.classList.remove('theme-light');
          document.body.classList.add('theme-dark');
          document.body.style.backgroundColor = '#0b0e14';
          document.body.style.color = '#f8fafc';
          var container = document.getElementById('editor-container');
          if (container) {
            container.style.backgroundColor = '#0b0e14';
            container.style.color = '#f8fafc';
          }
        }
      };
    })();

    @media print {

        padding: 0 !important;

    }

    /* Teams-style Spell Check Suggestion Popup */
    .spell-popup {
      position: fixed;
      background: #202020;
      border: 1px solid #383838;
      border-radius: 8px;

      font-weight: 600;
      color: #9ca3af;
      padding: 4px 8px 6px 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .spell-suggestion-item {

    .spell-action-btn {

      border: none;
      color: #9ca3af;
      font-size: 12px;

    .spell-action-btn:hover {

      color: #e5e7eb;
    }
    .menu-spell-item {
      display: flex;
      align-items: center;
      width: 100%;
      background: transparent;
      border: none;
      color: #f3f4f6;
      font-size: 13.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.15s;
    }
    .menu-spell-item:hover {
      background-color: #2e3035;
      color: #60a5fa;
    }
    .copy-button {

    .copy-button.copied {

    /* VS Code Find Widget */
    .vscode-find-widget {
      position: fixed;
      top: 10px;
      right: 24px;
      z-index: 10000;

    @keyframes findWidgetSlideIn {

    }
    .vscode-find-widget .find-part,
    .vscode-find-widget .replace-part {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }
    .vscode-find-widget .replace-part {

    }
    .vscode-find-widget .find-spacer {
      width: 20px;
      flex-shrink: 0;
    }
    .vscode-find-widget .find-expand-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 24px;
      background: transparent;
      border: none;
      color: #c5c5c5;
      cursor: pointer;
      border-radius: 2px;
      padding: 0;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .vscode-find-widget .find-expand-btn:hover {
      background-color: #37373d;
      color: #ffffff;
    }
    .vscode-find-widget .find-expand-btn.expanded {
      transform: rotate(90deg);
    }
    .vscode-find-widget .find-input-container {
      display: flex;
      align-items: center;
      background-color: #3c3c3c;
      border: 1px solid #3c3c3c;
      border-radius: 2px;
      padding: 0 4px 0 6px;
      flex: 1;
      min-width: 0;
      height: 25px;
      box-sizing: border-box;
      transition: border-color 0.1s ease;
    }
    .vscode-find-widget .find-input-container:focus-within {
      border-color: #007fd4;
      outline: 1px solid #007fd4;
    }
    .vscode-find-widget .find-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #cccccc;
      font-size: 13px;
      font-family: inherit;
      padding: 0;
      line-height: 23px;
    }
    .vscode-find-widget .find-input::placeholder {
      color: #858585;
    }
    .vscode-find-widget .find-toggles {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
      flex-shrink: 0;
    }
    .vscode-find-widget .find-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 19px;
      min-width: 19px;
      padding: 0 2px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 2px;
      color: #999999;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      line-height: 1;
    }
    .vscode-find-widget .find-toggle-btn:hover {
      background-color: #454545;
      color: #ffffff;
    }
    .vscode-find-widget .find-toggle-btn.active {
      background-color: rgba(0, 122, 204, 0.4);
      border-color: #007fd4;
      color: #ffffff;
    }
    .vscode-find-widget .find-count,
    .vscode-find-widget .find-count-spacer {
      font-size: 11.5px;
      color: #858585;
      white-space: nowrap;
      padding: 0 4px;
      width: 68px;
      min-width: 68px;
      text-align: center;
      flex-shrink: 0;
      user-select: none;
      box-sizing: border-box;
    }
    .vscode-find-widget .find-count.no-results {
      color: #f48771;
    }
    .vscode-find-widget .find-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .vscode-find-widget .find-action-btn,
    .vscode-find-widget .find-action-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      flex-shrink: 0;
    }
    .vscode-find-widget .find-action-btn {

      border: none;
      border-radius: 3px;
      color: #c5c5c5;
      cursor: pointer;

    /* Document Highlights */

      color: inherit;
    }
    ::highlight(vscode-find-match-current) {
      background-color: rgba(246, 185, 59, 0.85);
      color: #000000;
    }

  <script>
    function notifyHostFocus() {
      try {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(JSON.stringify({ type: 'editorFocused' }));
        }
      } catch (e) {}
    }
    window.addEventListener('focus', notifyHostFocus, true);
    window.addEventListener('pointerdown', notifyHostFocus, true);
  </script>
